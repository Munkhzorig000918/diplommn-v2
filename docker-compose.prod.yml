# Production stack — docker compose -f docker-compose.prod.yml up -d
#
# Everything except nginx stays on the internal network; only 80/443 are
# published. Fill .env.production first (see .env.production.example).
# Sensitive tier (Postgres/MinIO/API/worker + this whole stack) must run in
# Mongolia (NDC + domestic DR) once real PII enters the system.

name: diplommn

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: base
    command: ["pnpm", "db:migrate"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: always
    env_file: .env.production
    volumes:
      # Issuer key history + (until KMS) the signing key. Owned by ops,
      # never in the image, never in git.
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: worker
    restart: always
    env_file: .env.production
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:?}
    restart: always
    env_file: .env.production

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/diplom.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - api
      - web

  # One-shot/renewal certificate container (see docs/deployment.md).
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  pgdata:
  redisdata:
  miniodata:
  certbot-etc:
  certbot-www:
