services:
  postgres:
    image: postgres:16-alpine
    container_name: diplommn-postgres
    environment:
      POSTGRES_USER: diplommn
      POSTGRES_PASSWORD: diplommn_dev
      POSTGRES_DB: diplommn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplommn -d diplommn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: diplommn-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: diplommn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: diplommn
      MINIO_ROOT_PASSWORD: diplommn_dev
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
