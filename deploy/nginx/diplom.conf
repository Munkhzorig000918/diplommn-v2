# diplom.mn — single-origin routing: API paths proxy to the api service,
# everything else to the Next.js web app. Same origin keeps cookies simple
# and CORS closed.

server {
    listen 80;
    server_name diplom.mn www.diplom.mn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://diplom.mn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name diplom.mn www.diplom.mn;

    ssl_certificate     /etc/letsencrypt/live/diplom.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diplom.mn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # CSV imports and VC uploads.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- API surface (public verification, status list, DID, staff/holder APIs)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /status/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /.well-known/did.json {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Web app (public pages, portal, console)
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
