#cloud-config
# diplom.mn staging — EC2 user-data. Paste into "User data" when launching
# the instance (Ubuntu 24.04). Installs Docker + compose and prepares
# /opt/diplommn-v2 so the deployment runbook starts at "git clone".

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  # Reproducible image ids so compose only restarts changed services.
  - path: /etc/environment
    append: true
    content: |
      BUILDX_NO_DEFAULT_ATTESTATIONS=1

runcmd:
  # Docker (official repo — distro packages lag).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  # Host firewall (defence in depth on top of the AWS security group).
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt/diplommn-v2 /var/backups/diplommn
  - chown ubuntu:ubuntu /opt/diplommn-v2
